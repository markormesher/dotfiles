# reload config file
bind r source-file ~/.tmux.conf\; display-message "Config reloaded"

# relay Esc without delay
set -sg escape-time 0

# remap prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using h and v
unbind '"'
unbind %
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# enable mouse mode
set -g mouse on

# number windows and panels from 1
set -g base-index 1
setw -g pane-base-index 1

# auto rename and renumber windows
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# status appearance
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-left-length 256
set -g status-right-length 256
set -g status-left "#{?client_prefix,§, } "
set -g status-right "#(~/.tmux/status-right.sh)"
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "

# token-dark colour scheme - https://github.com/ThorstenRhau/token/blob/main/contrib/tmux/token-dark.conf
set -g status-style "bg=#191918,fg=#d4cfc6"
set -g status-left-style "bg=#191918,fg=#d97757,bold"
set -g status-right-style "bg=#191918,fg=#938e87"
setw -g window-status-style "bg=#191918,fg=#938e87"
setw -g window-status-current-style "bg=#191918,fg=#7b9ebd,bold"
setw -g window-status-activity-style "bg=#191918,fg=#c4a855"
setw -g window-status-bell-style "bg=#191918,fg=#c67777"
set -g pane-border-style "fg=#5a5955"
set -g pane-active-border-style "fg=#7b9ebd"
set -g message-style "bg=#262624,fg=#e8e4dc"
set -g message-command-style "bg=#262624,fg=#e8e4dc"
setw -g mode-style "bg=#3a3a37,fg=#e8e4dc"
setw -g clock-mode-colour "#d97757"
set -g display-panes-active-colour "#d97757"
set -g display-panes-colour "#5a5955"
